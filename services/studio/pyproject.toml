[project]
name = "selvedge-studio"
version = "0.1.0"
description = "Deterministic, priced media engine behind a validated spec, served to Selvedge agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "fonttools==4.68.0",
    "lxml==6.1.3",
    "numpy==2.5.5",
    "openpyxl==3.1.5",
    "pikepdf==10.18.2",
    "pillow==13.0.0",
    "pydantic==2.14.4",
    "pypdf==7.1.1",
    "pypdfium2==5.15.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pyyaml==6.0.4",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.17",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "types-openpyxl==3.1.5.20261122",
    "types-pyyaml==6.0.12.20261122",
    "lxml-stubs==0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selvedge_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = ["slow: tests that render long media"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Summaries deliberately use typographic characters.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "selvedge_studio.engine.runner.RunLimits",
    "selvedge_studio.spec.validate.SpecLimits",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "fontTools", "fontTools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["selvedge_studio.docs.deck_ops"]
disallow_untyped_calls = false
